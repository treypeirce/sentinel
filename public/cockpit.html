<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sentinel · Remediation Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0a0c10; --panel:#111520; --panel2:#161b28; --line:#232a39;
    --ink:#e9edf4; --dim:#8b98ac; --faint:#5c6880;
    --cyan:#33e1c4; --amber:#f5b13c; --grey:#7c8persist; --red:#f2555a; --green:#49d17f; --violet:#8b9cff;
    --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Inter',system-ui,sans-serif;
  }
  :root{--grey:#7c8aa0;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(circle at 88% -6%,rgba(51,225,196,.08),transparent 44%),radial-gradient(circle at 4% 108%,rgba(139,156,255,.06),transparent 42%);
    min-height:100vh}
  .mono{font-family:var(--mono)}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 5vw 48px}

  /* top bar */
  .top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:13px}
  .mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(150deg,var(--cyan),#1b9e8c);display:grid;place-items:center;color:#04231e;font-weight:800;font-size:20px;box-shadow:0 6px 20px rgba(51,225,196,.2)}
  .brand h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
  .brand .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:11.5px;color:var(--dim);border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 11px}
  .chip b{color:var(--ink);font-weight:600}
  .replay{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--violet);border:1px solid rgba(139,156,255,.3);border-radius:7px;padding:6px 11px;display:flex;align-items:center;gap:7px}
  .replay .rdot{width:7px;height:7px;border-radius:50%;background:var(--violet)}

  .counts{display:flex;gap:8px;margin:18px 0 20px;flex-wrap:wrap}
  .count{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:8px 13px;background:var(--panel)}
  .count b{font-size:16px}
  .count.fix b{color:var(--cyan)} .count.esc b{color:var(--amber)} .count.skip b{color:var(--grey)}

  /* layout */
  .grid{display:grid;grid-template-columns:minmax(0,0.92fr) minmax(0,1.08fr);gap:18px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .col-h{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:12px;font-weight:600}

  /* finding cards */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin-bottom:12px;position:relative}
  .card.fix{border-color:rgba(51,225,196,.35)}
  .card.escalate{border-color:rgba(245,177,60,.32)}
  .card .r1{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pkg{font-family:var(--mono);font-size:14.5px;font-weight:600;color:var(--ink)}
  .pill{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:4px 9px;border-radius:6px;white-space:nowrap}
  .pill.fix{color:#04231e;background:var(--cyan)}
  .pill.escalate{color:#2a1c00;background:var(--amber)}
  .pill.skip{color:#e9edf4;background:#2b3446}
  .r2{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0 10px}
  .badge{font-family:var(--mono);font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
  .badge .hi{color:var(--ink)}
  .sev-HIGH{color:var(--amber)!important} .sev-CRITICAL{color:var(--red)!important}
  .reach{font-family:var(--mono);font-size:11.5px;margin:6px 0 8px;line-height:1.5}
  .reach .yes{color:var(--green)} .reach .no{color:var(--faint)}
  .reach .path{color:var(--dim);word-break:break-word}
  .why{font-size:13px;color:var(--dim);line-height:1.5}
  .why.fix{color:var(--cyan)} .why.escalate{color:var(--amber)}
  .act{margin-top:13px}
  .btn{font-family:var(--sans);font-weight:600;font-size:13.5px;color:#04231e;background:var(--cyan);border:none;border-radius:9px;padding:9px 16px;cursor:pointer;transition:filter .15s}
  .btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.5;cursor:default}
  .btn.live{margin-right:8px}
  .btn.ghost{background:transparent;color:var(--cyan);border:1px solid var(--cyan)}
  .btn.ghost:hover{background:rgba(51,225,196,.08);filter:none}
  .escnote,.skipnote{font-family:var(--mono);font-size:11.5px;padding:8px 11px;border-radius:8px;margin-top:6px}
  .escnote{color:var(--amber);background:rgba(245,177,60,.08);border:1px solid rgba(245,177,60,.22)}
  .skipnote{color:var(--grey);background:rgba(124,138,160,.07);border:1px solid var(--line)}

  /* activity console */
  .console{background:#0c0f16;border:1px solid var(--line);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;min-height:520px}
  .console .ch{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .console .ch .t{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
  .console .ch .runmeta{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .log{flex:1;overflow-y:auto;padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.65}
  .empty{color:var(--faint);font-size:13px;font-family:var(--sans);padding:26px 8px;text-align:center}
  .line{margin-bottom:9px;display:flex;gap:9px;align-items:flex-start;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  .lb{flex-shrink:0;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:5px;text-transform:uppercase;margin-top:1px}
  .lb.plan{background:rgba(139,156,255,.15);color:var(--violet)}
  .lb.route{background:rgba(139,156,255,.15);color:var(--violet)}
  .lb.tool{background:rgba(51,225,196,.12);color:var(--cyan)}
  .lb.status{background:#232a39;color:var(--dim)}
  .lb.say{background:transparent;color:var(--faint);border:1px solid var(--line)}
  .lb.fail{background:rgba(242,85,90,.15);color:var(--red)}
  .lb.pass{background:rgba(73,209,127,.15);color:var(--green)}
  .lb.block{background:rgba(242,85,90,.15);color:var(--red)}
  .lb.diff{background:rgba(245,177,60,.14);color:var(--amber)}
  .lb.done{background:rgba(73,209,127,.15);color:var(--green)}
  .ltext{color:var(--ink)}
  .ltext .muted{color:var(--dim)}
  .line.say .ltext{color:var(--dim);font-style:italic}
  .line.block{background:rgba(242,85,90,.07);border:1px solid rgba(242,85,90,.25);border-radius:8px;padding:8px 10px}
  .line.block .ltext{color:var(--ink)}
  .line.block .reason{color:var(--red);display:block;margin-top:3px}
  .patch{white-space:pre;background:#0a0d13;border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-top:5px;color:var(--dim);font-size:11.5px;overflow-x:auto}
  .patch .add{color:var(--green)} .patch .del{color:var(--red)} .patch .fh{color:var(--violet)}
  .foot{border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel2)}
  .cost{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
  .cost b{color:var(--ink)}
  .prbar{display:none;font-family:var(--mono);font-size:12.5px}
  .prbar a{color:#04231e;background:var(--green);padding:7px 13px;border-radius:8px;text-decoration:none;font-weight:700}
  .prbar.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="mark">◈</div>
      <div>
        <h1>Sentinel</h1>
        <div class="tag">Governed Remediation Cockpit</div>
      </div>
    </div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="counts" id="counts"></div>

  <div class="grid">
    <div>
      <div class="col-h">Triage Queue</div>
      <div id="queue"></div>
    </div>
    <div>
      <div class="col-h">Agent Activity</div>
      <div class="console">
        <div class="ch">
          <span class="t">Remediation Run</span>
          <span class="runmeta" id="runmeta">idle</span>
        </div>
        <div class="log" id="log"><div class="empty" id="empty">Select <b>Remediate</b> on the FIX finding to run the agent. Skip and Escalate are decided without one.</div></div>
        <div class="foot">
          <span class="cost" id="cost">tokens <b>—</b></span>
          <span class="prbar" id="prbar"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const QUEUE = {
  "target": "/agent/workspace/acme-payments",
  "entry": "src/index.ts",
  "scannedFiles": 15,
  "scannedDeps": 9,
  "findings": [
    {
      "dependency": {
        "name": "node-forge",
        "version": "1.0.0",
        "direct": true
      },
      "advisory": {
        "id": "GHSA-5gfm-wpxj-wjgq",
        "cve": "CVE-2025-12816",
        "summary": "node-forge has an Interpretation Conflict vulnerability via its ASN.1 Validator Desynchronization",
        "cvssVector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:N",
        "cvssScore": 8.6,
        "severity": "HIGH",
        "fixedVersion": "1.4.0",
        "advisoryCount": 10
      },
      "epss": 0.00689,
      "epssPercentile": 0.4831,
      "riskScore": 52,
      "reachability": {
        "reachable": true,
        "importSites": [
          "src/payments/tokenSigning.ts"
        ],
        "reachablePath": [
          "src/index.ts",
          "src/payments/tokenSigning.ts"
        ],
        "scannedFiles": 15
      },
      "route": "ESCALATE",
      "rationale": "Reachable AND on a sensitive path — code on the settlement / money-movement path (src/payments, src/ledger, src/settlement). Requires human sign-off; agents do not auto-modify money-movement code.",
      "sensitiveMatch": "money-movement"
    },
    {
      "dependency": {
        "name": "jsonwebtoken",
        "version": "8.5.1",
        "direct": true
      },
      "advisory": {
        "id": "GHSA-8cf7-32gw-wr33",
        "cve": "CVE-2022-23539",
        "summary": "jsonwebtoken unrestricted key type could lead to legacy keys usage ",
        "cvssVector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N",
        "cvssScore": 8.1,
        "severity": "HIGH",
        "fixedVersion": "9.0.0",
        "advisoryCount": 3
      },
      "epss": 0.00479,
      "epssPercentile": 0.37901,
      "riskScore": 49,
      "reachability": {
        "reachable": true,
        "importSites": [
          "src/auth/tokens.ts",
          "src/middleware/auth.ts"
        ],
        "reachablePath": [
          "src/index.ts",
          "src/app.ts",
          "src/routes/auth.ts",
          "src/auth/tokens.ts"
        ],
        "scannedFiles": 15
      },
      "route": "FIX",
      "rationale": "Reachable on a live call path with a clean upstream fix (jsonwebtoken@9.0.0). Safe for an agent to reproduce, patch, and open a PR.",
      "sensitiveMatch": null
    },
    {
      "dependency": {
        "name": "marked",
        "version": "0.3.9",
        "direct": true
      },
      "advisory": {
        "id": "GHSA-5v2h-r2cx-5xgj",
        "cve": "CVE-2022-21681",
        "summary": "Inefficient Regular Expression Complexity in marked",
        "cvssVector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H",
        "cvssScore": 7.5,
        "severity": "HIGH",
        "fixedVersion": "4.0.10",
        "advisoryCount": 3
      },
      "epss": 0.02743,
      "epssPercentile": 0.8439,
      "riskScore": 46,
      "reachability": {
        "reachable": false,
        "importSites": [],
        "reachablePath": null,
        "scannedFiles": 15
      },
      "route": "SKIP",
      "rationale": "Vulnerable package present but not reachable from src/index.ts (0 reachable import sites across 15 files). Patching would add change-risk without reducing exposure.",
      "sensitiveMatch": null
    }
  ]
};
const RUN = {
  "meta": {
    "target": "acme-payments",
    "model": "composer-2.5",
    "mode": "recorded",
    "note": "Mirrors the real cloud run that opened PR #1 on treypeirce/acme-payments (agent bc-5196cc67).",
    "finding": "jsonwebtoken@8.5.1 \u00b7 CVE-2022-23539"
  },
  "events": [
    {
      "kind": "routing",
      "receipt": {
        "version": 1,
        "status": "selected",
        "workKind": "fix",
        "tier": "easy",
        "reason": "recorded-bounded-remediation",
        "requestedModel": "composer-2.5",
        "selectedModel": "composer-2.5",
        "params": [],
        "source": "recorded-run",
        "catalog": "unverified"
      },
      "delay": 220
    },
    {
      "kind": "status",
      "text": "Cloud agent started \u00b7 composer-2.5 \u00b7 treypeirce/acme-payments",
      "delay": 350
    },
    {
      "kind": "plan",
      "text": "Reproduce the weak JWT verification with a failing test, then upgrade jsonwebtoken to 9 and restrict verify() to HS256, then prove the suite is green. Change only what this fix needs.",
      "delay": 950
    },
    {
      "kind": "tool",
      "tool": "read",
      "detail": "src/middleware/auth.ts",
      "delay": 550
    },
    {
      "kind": "tool",
      "tool": "read",
      "detail": "src/auth/tokens.ts",
      "delay": 500
    },
    {
      "kind": "assistant",
      "text": "verify() is called with no algorithms option, so a token forged with a different HMAC algorithm (HS384) using the same secret would be accepted. Writing a reproduction test.",
      "delay": 950
    },
    {
      "kind": "tool",
      "tool": "write",
      "detail": "test/auth.security.test.ts (forges an HS384 token)",
      "delay": 700
    },
    {
      "kind": "tool",
      "tool": "shell",
      "detail": "npm test",
      "delay": 850
    },
    {
      "kind": "test",
      "status": "fail",
      "summary": "1 failing \u2014 the HS384-forged token is accepted by requireAuth (201). Vulnerability reproduced.",
      "delay": 1000
    },
    {
      "kind": "assistant",
      "text": "Confirmed. Upgrading jsonwebtoken and restricting the accepted algorithm.",
      "delay": 750
    },
    {
      "kind": "tool",
      "tool": "edit",
      "detail": "package.json \u2014 jsonwebtoken 8.5.1 \u2192 ^9.0.0 (resolved 9.0.3)",
      "delay": 650
    },
    {
      "kind": "tool",
      "tool": "shell",
      "detail": "npm install",
      "delay": 800
    },
    {
      "kind": "tool",
      "tool": "edit",
      "detail": "src/middleware/auth.ts \u2014 jwt.verify(token, secret, { algorithms: ['HS256'] })",
      "delay": 750
    },
    {
      "kind": "tool",
      "tool": "shell",
      "detail": "npm test",
      "delay": 950
    },
    {
      "kind": "test",
      "status": "pass",
      "summary": "13 passing \u2014 the forged HS384 token now returns 401 invalid_token.",
      "delay": 1000
    },
    {
      "kind": "diff",
      "files": [
        {
          "path": "package.json",
          "added": 1,
          "removed": 1
        },
        {
          "path": "src/middleware/auth.ts",
          "added": 3,
          "removed": 1
        },
        {
          "path": "test/auth.security.test.ts",
          "added": 22,
          "removed": 0
        }
      ],
      "patch": "  src/middleware/auth.ts\n- const claims = jwt.verify(token, config.jwtSecret) as SessionClaims;\n+ const claims = jwt.verify(token, config.jwtSecret, {\n+   algorithms: [\"HS256\"],\n+ }) as SessionClaims;\n\n  package.json\n- \"jsonwebtoken\": \"8.5.1\",\n+ \"jsonwebtoken\": \"^9.0.0\",",
      "delay": 900
    },
    {
      "kind": "done",
      "status": "complete",
      "branch": "cursor/jsonwebtoken-cve-fix-d312",
      "prUrl": "https://github.com/treypeirce/acme-payments/pull/1",
      "delay": 400
    }
  ]
};

const ROUTE_ORDER = { FIX: 0, ESCALATE: 1, SKIP: 2 };
const el = (id) => document.getElementById(id);

function renderMeta() {
  const m = el("meta");
  m.innerHTML =
    '<span class="chip"><b>' + (QUEUE.target ? QUEUE.target.split("/").pop() : "target") + '</b></span>' +
    '<span class="chip">entry <b>' + (QUEUE.entry || "?") + '</b></span>' +
    '<span class="chip">' + QUEUE.scannedDeps + ' deps · ' + QUEUE.scannedFiles + ' files</span>' +
    '<span class="chip">OSV.dev + EPSS</span>' +
    '<span class="replay"><span class="rdot"></span>replay</span>';

  const c = { FIX: 0, ESCALATE: 0, SKIP: 0 };
  QUEUE.findings.forEach((f) => (c[f.route] = (c[f.route] || 0) + 1));
  el("counts").innerHTML =
    '<span class="count fix"><b>' + (c.FIX||0) + '</b> FIX</span>' +
    '<span class="count esc"><b>' + (c.ESCALATE||0) + '</b> ESCALATE</span>' +
    '<span class="count skip"><b>' + (c.SKIP||0) + '</b> SKIP</span>';
}

function reachHtml(f) {
  const r = f.reachability;
  if (r.reachable && r.reachablePath) {
    return '<div class="reach"><span class="yes">● reachable</span> <span class="path">' +
      r.reachablePath.join(" → ") + '</span></div>';
  }
  return '<div class="reach"><span class="no">○ unreachable</span> <span class="path">0 import sites across ' +
    r.scannedFiles + ' files</span></div>';
}

function cardHtml(f) {
  const route = f.route.toLowerCase();
  const sev = f.advisory.severity || "";
  const cvss = f.advisory.cvssScore != null ? f.advisory.cvssScore.toFixed(1) : "?";
  const epss = f.epss != null ? (f.epss * 100).toFixed(f.epss < 0.01 ? 2 : 1) + "%" : "n/a";
  let action = "";
  if (f.route === "FIX") {
    action = '<div class="act">' +
      '<button class="btn live" id="remediate-live" style="display:none">☁ Run live on cloud</button>' +
      '<button class="btn ghost" id="remediate">▶ Play recorded run</button>' +
      '</div>';
  } else if (f.route === "ESCALATE") {
    action = '<div class="escnote">! human sign-off required — ' + (f.sensitiveMatch || "sensitive path") + '</div>';
  } else {
    action = '<div class="skipnote">· no action — patching an unreachable package only adds risk</div>';
  }
  return '<div class="card ' + route + '" data-pkg="' + f.dependency.name + '">' +
    '<div class="r1"><span class="pkg">' + f.dependency.name + '@' + f.dependency.version + '</span>' +
    '<span class="pill ' + route + '">' + f.route + '</span></div>' +
    '<div class="r2">' +
      '<span class="badge">' + (f.advisory.cve || f.advisory.id) + '</span>' +
      '<span class="badge">CVSS <span class="hi sev-' + sev + '">' + cvss + ' ' + sev + '</span></span>' +
      '<span class="badge">EPSS <span class="hi">' + epss + '</span></span>' +
      '<span class="badge">risk <span class="hi">' + f.riskScore + '</span></span>' +
    '</div>' +
    reachHtml(f) +
    '<div class="why ' + route + '">' + f.rationale + '</div>' +
    action + '</div>';
}

function renderQueue() {
  const sorted = QUEUE.findings.slice().sort((a, b) => {
    const d = ROUTE_ORDER[a.route] - ROUTE_ORDER[b.route];
    return d !== 0 ? d : b.riskScore - a.riskScore;
  });
  el("queue").innerHTML = sorted.map(cardHtml).join("");
  const btn = el("remediate");
  if (btn) btn.addEventListener("click", startRun);
  const live = el("remediate-live");
  if (live) live.addEventListener("click", startLiveRun);
  checkLive();
}

/* Show the live cloud button only when a server with a key is present. */
async function checkLive() {
  try {
    const r = await fetch("/api/health");
    if (!r.ok) return;
    const h = await r.json();
    if (h.live) { const b = el("remediate-live"); if (b) b.style.display = ""; }
  } catch (_) { /* opened as a file / no server — recorded run only */ }
}

let elapsed = null;
function startLiveRun() {
  if (running) return;
  running = true;
  const lb = el("remediate-live");
  const rb = el("remediate");
  if (lb) { lb.disabled = true; lb.textContent = "Running on cloud…"; }
  if (rb) rb.disabled = true;
  el("empty").style.display = "none";
  el("log").innerHTML = "";
  curAssistant = null; lastTool = null;
  const t0 = Date.now();
  el("runmeta").textContent = "cloud · live · 0s";
  elapsed = setInterval(() => { el("runmeta").textContent = "cloud · live · " + Math.round((Date.now() - t0) / 1000) + "s"; }, 1000);
  const es = new EventSource("/api/run-cloud");
  es.onmessage = (m) => { let e; try { e = JSON.parse(m.data); } catch (_) { return; } render(e); if (e.kind === "done") finishLive(es, lb); };
  es.addEventListener("end", () => finishLive(es, lb));
  es.onerror = () => {
    addLine('<span class="lb fail">error</span><span class="ltext">Live run unavailable — start the cockpit server with your key set (npm run cockpit). The recorded run always works.</span>', "fail");
    finishLive(es, lb);
  };
}
function finishLive(es, lb) {
  try { es.close(); } catch (_) {}
  if (elapsed) { clearInterval(elapsed); elapsed = null; }
  running = false;
  if (lb) { lb.disabled = false; lb.textContent = "☁ Run live on cloud"; }
  const rb = el("remediate");
  if (rb) rb.disabled = false;
}

/* ---- replay ---- */
function toolText(e) {
  const map = { read: "read", write: "write", edit: "edit", shell: "$", read_file: "read", file_search: "search", run_terminal_cmd: "$", list_dir: "ls", grep: "grep" };
  const verb = map[e.tool] || e.tool;
  return '<span class="muted">' + verb + '</span>' + (e.detail ? " " + escapeHtml(e.detail) : "");
}
function escapeHtml(s){return String(s).replace(/[&<>]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function patchHtml(patch) {
  return patch.split("\n").map((ln) => {
    if (ln.startsWith("+")) return '<span class="add">' + escapeHtml(ln) + '</span>';
    if (ln.startsWith("-")) return '<span class="del">' + escapeHtml(ln) + '</span>';
    if (/\.(ts|json)\s*$/.test(ln.trim()) || ln.trim().endsWith(".ts") || ln.trim().endsWith(".json")) return '<span class="fh">' + escapeHtml(ln) + '</span>';
    return escapeHtml(ln);
  }).join("\n");
}

function addLine(html, cls) {
  const log = el("log");
  const div = document.createElement("div");
  div.className = "line " + (cls || "");
  div.innerHTML = html;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

let running = false;
let curAssistant = null;
let lastTool = null;
function startRun() {
  if (running) return;
  running = true;
  const btn = el("remediate");
  if (btn) { btn.disabled = true; btn.textContent = "Remediating…"; }
  el("empty").style.display = "none";
  el("log").innerHTML = "";
  curAssistant = null; lastTool = null;
  el("runmeta").textContent = RUN.meta.model + " · " + RUN.meta.mode;
  let i = 0;
  const events = RUN.events;
  function next() {
    if (i >= events.length) {
      if (btn) btn.textContent = "✓ Completed";
      running = false;
      return;
    }
    const e = events[i++];
    render(e);
    setTimeout(next, e.delay || 650);
  }
  next();
}

function render(e) {
  if (e.kind !== "assistant") curAssistant = null;
  if (e.kind !== "tool") lastTool = null;
  switch (e.kind) {
    case "status":
      addLine('<span class="lb status">agent</span><span class="ltext muted">' + escapeHtml(e.text) + '</span>', "status");
      break;
    case "routing": {
      const r = e.receipt || {};
      const model = (r.sdkResolvedModel && r.sdkResolvedModel.id) || r.selectedModel || r.requestedModel || "unavailable";
      const copy = r.status === "blocked"
        ? "blocked · " + (r.blockedReason || "model unavailable")
        : ((r.tier || "") + " " + (r.workKind || "work") + " → " + model + " · " + (r.source || "default")).trim();
      addLine('<span class="lb route">route</span><span class="ltext">' + escapeHtml(copy) + '</span>', "route");
      break;
    }
    case "plan":
      addLine('<span class="lb plan">plan</span><span class="ltext">' + escapeHtml(e.text) + '</span>', "plan");
      break;
    case "tool": {
      const detail = e.detail || "";
      const label = (e.tool === "shell" || e.tool === "run_terminal_cmd") ? "shell" : "tool";
      if (lastTool && lastTool.name === e.tool && lastTool.detail === detail) {
        lastTool.count++;
        lastTool.el.querySelector(".ltext").innerHTML = toolText(e) + ' <span class="muted">×' + lastTool.count + '</span>';
      } else {
        const log = el("log");
        const div = document.createElement("div");
        div.className = "line tool";
        div.innerHTML = '<span class="lb tool">' + label + '</span><span class="ltext">' + toolText(e) + '</span>';
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
        lastTool = { name: e.tool, detail: detail, el: div, count: 1 };
      }
      break;
    }
    case "assistant": {
      const txt = escapeHtml(e.text);
      if (curAssistant) {
        curAssistant.querySelector(".ltext").innerHTML += txt;
        el("log").scrollTop = el("log").scrollHeight;
      } else {
        const log = el("log");
        const div = document.createElement("div");
        div.className = "line say";
        div.innerHTML = '<span class="lb say">agent</span><span class="ltext">' + txt + '</span>';
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
        curAssistant = div;
      }
      break;
    }
    case "test":
      addLine('<span class="lb ' + (e.status === "pass" ? "pass" : "fail") + '">' + (e.status === "pass" ? "green" : "red") +
        '</span><span class="ltext">' + escapeHtml(e.summary) + '</span>', e.status);
      break;
    case "guardrail":
      addLine('<span class="lb block">blocked</span><span class="ltext">' + escapeHtml(e.blocked) +
        '<span class="reason">↳ ' + escapeHtml(e.reason) + '</span></span>', "block");
      break;
    case "diff": {
      const files = e.files.map((f) => f.path + " (+" + f.added + " −" + f.removed + ")").join(",  ");
      let html = '<span class="lb diff">diff</span><span class="ltext">' + escapeHtml(files) + '</span>';
      addLine(html, "diff");
      if (e.patch) {
        const p = document.createElement("div");
        p.className = "patch";
        p.innerHTML = patchHtml(e.patch);
        el("log").appendChild(p);
        el("log").scrollTop = el("log").scrollHeight;
      }
      break;
    }
    case "usage":
      el("cost").innerHTML = "tokens <b>" + e.tokens.toLocaleString() + "</b>";
      break;
    case "done": {
      addLine('<span class="lb done">done</span><span class="ltext">status ' + escapeHtml(e.status) +
        (e.branch ? ' · branch <span class="muted">' + escapeHtml(e.branch) + '</span>' : "") + '</span>', "done");
      const pr = el("prbar");
      if (e.prUrl) {
        pr.className = "prbar show";
        pr.innerHTML = '<a href="' + e.prUrl + '" target="_blank" rel="noopener noreferrer">PR opened ↗</a>';
      }
      const card = document.querySelector('.card.fix .pill');
      if (card) { card.textContent = "PR OPENED"; }
      break;
    }
  }
}

renderMeta();
renderQueue();
</script>
