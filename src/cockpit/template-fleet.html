<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sentinel · Fleet Remediation Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --panel2:#fafbfc; --line:#e7e9ee;
    --ink:#171a20; --dim:#5c6472; --faint:#9aa2af;
    --blue:#2760e8; --bluebg:#eef3fe;
    --amber:#a16207; --amberbg:#fbf5e6;
    --green:#12824c; --greenbg:#ecf8f1;
    --red:#c03538; --redbg:#fdf0f0;
    --grey:#6e7684; --greybg:#f1f3f6;
    --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
  .mono{font-family:var(--mono)}
  .wrap{max-width:1240px;margin:0 auto;padding:26px 5vw 56px}
  a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}

  .top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px}
  .mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px}
  .brand h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .brand .tag{font-size:12px;color:var(--dim)}
  .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{font:600 13px var(--sans);color:#fff;background:var(--ink);border:none;border-radius:8px;padding:8px 14px;cursor:pointer}
  .btn:hover{opacity:.88} .btn:disabled{opacity:.45;cursor:default}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:#c9cedb;opacity:1}
  .gchip{font:500 11.5px var(--sans);color:var(--dim);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:default}
  .gchip b{color:var(--green)}
  .replay{font:500 11px var(--mono);color:var(--faint)}

  .summary{display:flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:18px 0 20px;overflow:hidden}
  .stat{flex:1;min-width:108px;padding:14px 18px}
  .stat+.stat{border-left:1px solid var(--line)}
  .stat b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em}
  .stat span{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .stat.fix b{color:var(--blue)} .stat.esc b{color:var(--amber)} .stat.skip b{color:var(--grey)}

  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}
  .svc{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
  .svc .h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .svc .h .n{font-weight:700;font-size:14.5px}
  .svc .h .r{font:400 11px var(--mono);color:var(--faint)}
  .pills{display:flex;gap:5px}
  .pill{font:700 10px var(--mono);padding:3px 8px;border-radius:5px}
  .pill.fix{color:var(--blue);background:var(--bluebg)}
  .pill.escalate{color:var(--amber);background:var(--amberbg)}
  .pill.skip{color:var(--grey);background:var(--greybg)}
  .body{padding:14px 18px 18px;flex:1;display:flex;flex-direction:column;gap:14px}

  .finding{padding-left:12px;border-left:2px solid var(--line)}
  .finding.fix{border-color:var(--blue)} .finding.escalate{border-color:var(--amber)} .finding.skip{border-color:#c9cedb}
  .frow{display:flex;align-items:baseline;gap:8px}
  .pkg{font-weight:600;font-size:13px}
  .cve{font:400 11px var(--mono);color:var(--dim);margin-left:auto}
  .ftag{font:700 9.5px var(--mono);letter-spacing:.05em}
  .ftag.fix{color:var(--blue)} .ftag.escalate{color:var(--amber)} .ftag.skip{color:var(--grey)}
  .risk{display:flex;align-items:center;gap:10px;margin:6px 0 7px;font:400 11px var(--mono);color:var(--dim);flex-wrap:wrap}
  .risk b{color:var(--ink);font-weight:600}
  .riskbar{flex:1;min-width:56px;height:4px;background:#edeff3;border-radius:2px;overflow:hidden}
  .riskbar>span{display:block;height:100%;background:var(--blue);border-radius:2px}

  .reach{font:400 11px var(--mono)}
  .rlabel{display:block;font-weight:700;color:var(--ink);margin-bottom:4px}
  .rdot{color:var(--red)}
  .reach.declined .rlabel{color:var(--green)}
  .reach .evi{color:var(--faint)}
  .crumbs{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .crumb{background:var(--greybg);color:var(--dim);border-radius:5px;padding:2px 7px;font-size:10.5px}
  .crumb.entry{background:var(--bluebg);color:var(--blue)}
  .crumb.sink{background:var(--redbg);color:var(--red)}
  .arr{color:var(--faint)}

  .issuelink{font:500 12px var(--sans);color:var(--amber);background:var(--amberbg);border-radius:8px;padding:9px 12px}
  .issuelink a{color:var(--amber);font-weight:700}
  .prlink{display:none;font:500 12px var(--sans);color:var(--green);background:var(--greenbg);border-radius:8px;padding:9px 12px}
  .prlink.show{display:block} .prlink a{color:var(--green);font-weight:700}

  .lanelog{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:400 11px var(--mono);line-height:1.6;min-height:64px;max-height:230px;overflow-y:auto}
  .lanelog .idle{color:var(--faint)}
  .ln{margin-bottom:6px;display:flex;gap:7px;align-items:flex-start;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .lb{flex-shrink:0;font:700 9px var(--mono);padding:1px 6px;border-radius:4px;text-transform:uppercase;margin-top:2px}
  .lb.plan{background:var(--bluebg);color:var(--blue)}
  .lb.tool{background:var(--greybg);color:var(--grey)}
  .lb.status{background:var(--greybg);color:var(--dim)}
  .lb.fail{background:var(--redbg);color:var(--red)}
  .lb.pass{background:var(--greenbg);color:var(--green)}
  .lb.done{background:var(--greenbg);color:var(--green)}
  .tx{color:var(--ink)} .tx .muted{color:var(--dim)}

  footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);color:var(--faint);font-size:11.5px;font-family:var(--mono)}
  footer .mono{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="mark">◈</div>
      <div><h1>Sentinel</h1><div class="tag">Fleet remediation cockpit</div></div>
    </div>
    <div class="actions">
      <button class="btn" id="run-live" style="display:none">Run fleet on cloud</button>
      <button class="btn ghost" id="run-replay">Play recorded run</button>
      <span class="gchip" title="beforeShellExecution hook denies: curl|sh · git push --force · rm -rf · .github/workflows edits · .env reads · publish"><b>✓</b> change-control hooks enforced</span>
      <span class="replay" id="runmeta">idle</span>
    </div>
  </div>

  <div class="summary" id="summary"></div>
  <div class="grid" id="grid"></div>
  <footer id="foot"></footer>
</div>

<script>
const FLEET = __FLEET_JSON__;
const RUN = __RUN_JSON__;
const el = (id) => document.getElementById(id);
const ART = (RUN.meta && RUN.meta.artifacts) || { prs: {}, issues: {} };

function esc(s){return String(s).replace(/[&<>]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
const routeOrder={FIX:0,ESCALATE:1,SKIP:2};

function renderSummary(){
  const s = FLEET.summary;
  el("summary").innerHTML =
    '<div class="stat"><b>'+s.services+'</b><span>services</span></div>' +
    '<div class="stat fix"><b>'+s.FIX+'</b><span>auto-fix</span></div>' +
    '<div class="stat esc"><b>'+s.ESCALATE+'</b><span>escalate</span></div>' +
    '<div class="stat skip"><b>'+s.SKIP+'</b><span>skip</span></div>' +
    '<div class="stat"><b>'+s.findings+'</b><span>findings</span></div>';
  el("foot").innerHTML = 'recorded run · '+esc(RUN.meta.model)
    + ' · guardrail hooks active · verify: <span class="mono">npm run guardrail:check</span>';
}

function findingLine(f){
  const r=f.route.toLowerCase();
  const cvss=f.advisory.cvssScore!=null?f.advisory.cvssScore.toFixed(1):"?";
  const epss=f.epss!=null?(f.epss*100).toFixed(f.epss<0.01?2:1)+"%":"n/a";
  const risk=f.riskScore;
  let reachHtml;
  if(f.reachability.reachable && f.reachability.reachablePath){
    const path=f.reachability.reachablePath;
    const crumbs=path.map((p,i)=>{
      const label=esc(p.split("/").pop());
      const cls=i===0?"crumb entry":(i===path.length-1?"crumb sink":"crumb");
      return '<span class="'+cls+'">'+label+'</span>';
    }).join('<span class="arr">→</span>');
    reachHtml='<div class="reach reachable"><span class="rlabel"><span class="rdot">●</span> Reachable</span><div class="crumbs">'+crumbs+'</div></div>';
  } else {
    reachHtml='<div class="reach declined"><span class="rlabel">✓ Not reachable</span><span class="evi">0 imports · '+f.reachability.scannedFiles+' files scanned</span></div>';
  }
  return '<div class="finding '+r+'">'
    +'<div class="frow"><span class="pkg">'+f.dependency.name+'@'+f.dependency.version+'</span><span class="cve">'+(f.advisory.cve||f.advisory.id)+'</span><span class="ftag '+r+'">'+f.route+'</span></div>'
    +'<div class="risk"><span class="rk" title="CVSS · severity if exploited (0-10)">CVSS <b>'+cvss+'</b></span><span class="rk" title="EPSS · probability of exploitation in the wild">EPSS <b>'+epss+'</b></span><span class="rk" title="Blended score that decides the route">risk <b>'+risk+'</b>/100</span><span class="riskbar"><span style="width:'+risk+'%"></span></span></div>'
    +reachHtml
    +'</div>';
}

function svcCard(svc){
  const findings = svc.report.findings.slice().sort((a,b)=>routeOrder[a.route]-routeOrder[b.route]);
  const routes = [...new Set(findings.map(f=>f.route))];
  const cls = routes.includes("FIX") ? "fix" : (routes.includes("ESCALATE") ? "escalate" : "skip");
  const pills = routes.map(r=>'<span class="pill '+r.toLowerCase()+'">'+r+'</span>').join("");
  let body = findings.map(findingLine).join("");

  const hasFix = routes.includes("FIX");
  if (hasFix) {
    body += '<div class="lanelog" id="lane-'+svc.name+'"><div class="idle">awaiting run…</div></div>';
    body += '<div class="prlink" id="pr-'+svc.name+'"></div>';
  }
  const escF = findings.find(f=>f.route==="ESCALATE");
  if (escF) {
    const issue = ART.issues[svc.name];
    body += '<div class="issuelink">Human review required'+(issue?' → <a href="'+issue+'" target="_blank" rel="noopener noreferrer">open issue ↗</a>':'')+'</div>';
  }
  void hasFix;
  return '<div class="svc '+cls+'"><div class="h"><div><div class="n">'+svc.name+'</div>'
    +'<div class="r">'+svc.repoUrl.replace("https://github.com/","")+'</div></div><div class="pills">'+pills+'</div></div>'
    +'<div class="body">'+body+'</div></div>';
}

function renderGrid(){
  const order = FLEET.services.slice().sort((a,b)=>{
    const ar = a.report.findings.some(f=>f.route==="FIX")?0:(a.report.findings.some(f=>f.route==="ESCALATE")?1:2);
    const br = b.report.findings.some(f=>f.route==="FIX")?0:(b.report.findings.some(f=>f.route==="ESCALATE")?1:2);
    return ar-br;
  });
  el("grid").innerHTML = order.map(svcCard).join("");
}

/* ---- lane streaming ---- */
const lane = {}; // name -> {log, curA, lastT}
function laneFor(name){
  if(!lane[name]){ const log=el("lane-"+name); if(!log) return null; log.innerHTML=""; lane[name]={log,curA:null,lastT:null}; }
  return lane[name];
}
function toolText(e){const m={read:"read",write:"write",edit:"edit",shell:"$",read_file:"read",file_search:"search",run_terminal_cmd:"$"};const v=m[e.tool]||e.tool;return '<span class="muted">'+v+'</span>'+(e.detail?" "+esc(e.detail):"");}
function addLn(L,html,cls){const d=document.createElement("div");d.className="ln "+(cls||"");d.innerHTML=html;L.log.appendChild(d);L.log.scrollTop=L.log.scrollHeight;return d;}

function renderTo(name,e){
  const L=laneFor(name); if(!L) return;
  if(e.kind!=="assistant") L.curA=null;
  if(e.kind!=="tool") L.lastT=null;
  switch(e.kind){
    case "status": addLn(L,'<span class="lb status">agent</span><span class="tx muted">'+esc(e.text)+'</span>'); break;
    case "plan": addLn(L,'<span class="lb plan">plan</span><span class="tx">'+esc(e.text)+'</span>'); break;
    case "assistant": {
      const t=esc(e.text);
      if(L.curA){ L.curA.querySelector(".tx").innerHTML+=t; L.log.scrollTop=L.log.scrollHeight; }
      else L.curA=addLn(L,'<span class="lb status">agent</span><span class="tx">'+t+'</span>');
      break;
    }
    case "tool": {
      const detail=e.detail||"";
      if(L.lastT && L.lastT.name===e.tool && L.lastT.detail===detail){ L.lastT.count++; L.lastT.el.querySelector(".tx").innerHTML=toolText(e)+' <span class="muted">×'+L.lastT.count+'</span>'; }
      else { const d=addLn(L,'<span class="lb tool">'+((e.tool==="shell"||e.tool==="run_terminal_cmd")?"shell":"tool")+'</span><span class="tx">'+toolText(e)+'</span>'); L.lastT={name:e.tool,detail,el:d,count:1}; }
      break;
    }
    case "test": addLn(L,'<span class="lb '+(e.status==="pass"?"pass":"fail")+'">'+(e.status==="pass"?"green":"red")+'</span><span class="tx">'+esc(e.summary)+'</span>',e.status); break;
    case "done": {
      addLn(L,'<span class="lb done">done</span><span class="tx">PR opened</span>');
      const pr = e.prUrl || ART.prs[name];
      const bar=el("pr-"+name);
      if(bar && pr && pr!=="PENDING"){ bar.className="prlink show"; bar.innerHTML='✓ <a href="'+pr+'" target="_blank" rel="noopener noreferrer">'+pr.replace("https://github.com/","")+' ↗</a>'; }
      else if(bar){ bar.className="prlink show"; bar.textContent="✓ draft PR opened"; }
      break;
    }
  }
}

/* ---- recorded replay ---- */
let running=false;
function playRecorded(){
  if(running) return; running=true;
  Object.keys(lane).forEach(k=>delete lane[k]);
  document.querySelectorAll(".prlink").forEach(p=>{p.className="prlink";p.innerHTML="";});
  el("runmeta").textContent="recorded · parallel";
  const tl=RUN.timeline; let i=0;
  (function step(){ if(i>=tl.length){running=false;el("runmeta").textContent="recorded · done";return;} const e=tl[i++]; renderTo(e.lane,e); setTimeout(step,e.delay||600); })();
}

/* ---- live parallel cloud ---- */
let es=null, tick=null;
function runLive(){
  if(running) return; running=true;
  Object.keys(lane).forEach(k=>delete lane[k]);
  document.querySelectorAll(".prlink").forEach(p=>{p.className="prlink";p.innerHTML="";});
  const t0=Date.now(); el("runmeta").textContent="cloud · live · 0s";
  tick=setInterval(()=>el("runmeta").textContent="cloud · live · "+Math.round((Date.now()-t0)/1000)+"s",1000);
  es=new EventSource("/api/run-fleet");
  let doneCount=0; const fixCount=FLEET.services.filter(s=>s.report.findings.some(f=>f.route==="FIX")).length;
  es.onmessage=(m)=>{ let e; try{e=JSON.parse(m.data);}catch(_){return;} if(e.lane) renderTo(e.lane,e); if(e.kind==="done"){ doneCount++; if(doneCount>=fixCount) finishLive(); } };
  es.addEventListener("end",finishLive);
  es.onerror=()=>{ el("runmeta").textContent="live unavailable · use recorded run"; finishLive(); };
}
function finishLive(){ if(es){try{es.close();}catch(_){}} if(tick){clearInterval(tick);tick=null;} running=false; }

async function checkLive(){ try{ const r=await fetch("/api/health"); if(!r.ok) return; const h=await r.json(); if(h.live){ el("run-live").style.display=""; } }catch(_){} }

renderSummary();
renderGrid();
el("run-replay").addEventListener("click",playRecorded);
el("run-live").addEventListener("click",runLive);
checkLive();
</script>
</body>
</html>
